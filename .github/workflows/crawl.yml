name: Daily Crawl and ETL

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC hàng ngày (tương đương 09:00 sáng giờ Việt Nam)
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất kỳ lúc nào trên GitHub

jobs:
  crawl_and_etl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 8 Scrapy Spiders
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
        run: |
          cd "Code/priceintelli-crawler"
          echo "Starting crawling 8 stores..."
          scrapy crawl apple_vn
          scrapy crawl fptshop
          scrapy crawl thegioididong
          scrapy crawl topzone
          scrapy crawl cellphones
          scrapy crawl hoanghamobile
          scrapy crawl viettelstore
          scrapy crawl mobilecity
          echo "All 8 spiders finished crawling!"

      - name: Run ETL Pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.POSTGRES_URL }}
          PGSSLMODE: require
        run: |
          cd "Code/priceintelli-etl"
          echo "Starting ETL pipeline..."
          python etl_pipeline.py
          echo "ETL pipeline completed successfully!"
