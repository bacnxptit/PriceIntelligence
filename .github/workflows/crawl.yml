name: Daily Crawl and ETL

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC hàng ngày (tương đương 09:00 sáng giờ Việt Nam)
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất kỳ lúc nào trên GitHub

jobs:
  crawl_and_etl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 8 Scrapy Spiders
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGODB_URI: ${{ secrets.MONGO_URI }}
          MONGODB_DB: imdb
          MONGO_DB: imdb
          SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
        run: |
          cd "Code/priceintelli-crawler"
          echo "Starting crawling 8 stores..."
          scrapy crawl apple_vn || echo "Spider apple_vn exited with warning/error, continuing..."
          scrapy crawl fptshop || echo "Spider fptshop exited with warning/error, continuing..."
          scrapy crawl thegioididong || echo "Spider thegioididong exited with warning/error, continuing..."
          scrapy crawl topzone || echo "Spider topzone exited with warning/error, continuing..."
          scrapy crawl cellphones || echo "Spider cellphones exited with warning/error, continuing..."
          scrapy crawl hoanghamobile || echo "Spider hoanghamobile exited with warning/error, continuing..."
          scrapy crawl viettelstore || echo "Spider viettelstore exited with warning/error, continuing..."
          scrapy crawl mobilecity || echo "Spider mobilecity exited with warning/error, continuing..."
          echo "Finished crawling phase across all 8 stores!"

      - name: Run ETL Pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.POSTGRES_URL }}
          PGSSLMODE: require
        run: |
          cd "Code/priceintelli-etl"
          echo "Starting ETL pipeline..."
          python etl_pipeline.py
          echo "ETL pipeline completed successfully!"
